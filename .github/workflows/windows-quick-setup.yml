name: Windows Quick Setup Bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - config/quick-setup/**
      - .github/workflows/windows-quick-setup.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config/quick-setup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test verified installer download
        run: node --test config/quick-setup/download-orca.test.mjs
      - name: Upload setup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Windows-Quick-Setup
          path: |
            config/quick-setup/Start-Orca-Setup.cmd
            config/quick-setup/download-orca.mjs
            config/quick-setup/README.md
          if-no-files-found: error
          retention-days: 30
